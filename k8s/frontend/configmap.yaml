apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://backend:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Enterprise GitOps Platform</title>
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); text-align: center; max-width: 500px; width: 100%; border: 1px solid #334155; }
        h1 { color: #38bdf8; margin-top: 0; }
        .stat { font-size: 2.5rem; font-weight: bold; color: #4ade80; margin: 1rem 0; }
        .info { font-size: 0.9rem; color: #94a3b8; background: #0f172a; padding: 0.8rem; border-radius: 6px; word-break: break-all; margin-top: 1rem; }
        button { background: #38bdf8; border: none; padding: 0.8rem 1.5rem; font-weight: bold; border-radius: 6px; cursor: pointer; color: #0f172a; transition: background 0.2s; }
        button:hover { background: #0284c7; color: #ffffff; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Enterprise GitOps</h1>
        <p>AKS &bull; ArgoCD &bull; ACR &bull; Redis</p>
        <div class="stat" id="hits">-</div>
        <p>Total Hit Counter</p>
        <button onclick="fetchHits()">Refresh Hit</button>
        <div class="info" id="info">Connecting to Backend API...</div>
      </div>
      <script>
        async function fetchHits() {
          try {
            const res = await fetch('/api/');
            const data = await res.json();
            document.getElementById('hits').innerText = data.hits || 0;
            document.getElementById('info').innerHTML = `<strong>Backend Pod:</strong> ${data.pod}<br><strong>Redis:</strong> ${data.redis_host}`;
          } catch(e) {
            document.getElementById('info').innerText = 'API Connection Error: ' + e;
          }
        }
        fetchHits();
      </script>
    </body>
    </html>
