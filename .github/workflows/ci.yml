name: Backend CI - Build & Push to ACR

on:
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"

permissions:
  id-token: write
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name acrenterprisecan01

      - name: Build and Push Docker Image
        run: |
          docker build -t acrenterprisecan01.azurecr.io/backend:${{ github.sha }} -t acrenterprisecan01.azurecr.io/backend:latest apps/backend
          docker push --all-tags acrenterprisecan01.azurecr.io/backend

      - name: Update K8s Manifests
        run: |
          sed -i "s|image: acrenterprisecan01.azurecr.io/backend:.*|image: acrenterprisecan01.azurecr.io/backend:${{ github.sha }}|g" k8s/backend/deployment.yaml
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend/deployment.yaml
          git commit -m "chore: update backend image tag to ${{ github.sha }} [skip ci]"
          git push